<!DOCTYPE html>
<html lang="en" type="overview" class="is-loading">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- The scoreboard display used to live here: links to a court
         (index.html?org=&court=, ?channel=, ?theme=) go on to display.html,
         so stream, OBS and Playerzone links keep working. ?org= alone is the
         overview's own org filter. Runs before anything loads. -->
    <script>
        (function () {
            var params = new URLSearchParams(location.search);
            if (['court', 'channel', 'theme'].some(function (key) { return params.has(key); })) {
                location.replace('display.html' + location.search + location.hash);
            }
        })();
    </script>
    <title>Live Matches</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js" integrity="sha384-vtXRMe3mGCbOeY7l30aIg8H9p3GdeSe4IFlP6G8JMa7o7lXvnz3GFKzPxzJdPfGK" crossorigin="anonymous"></script>
    <script type="module" src="js/overview.js?v=4"></script>
    <link rel="stylesheet" href="css/style_overview.css?v=4">
</head>

<body>
    <div class="wrapper">
        <div class="inner">
            <header class="page_head">
                <!-- Live matches | Input panel - the input panel has the same pair the other way round -->
                <nav class="title" aria-label="Pages">
                    <h1>Live Matches <span class="page_spinner" role="status" aria-label="Loading"></span></h1>
                    <a class="tab_link" href="input.html" title="Control a court (login required)">
                        <i class="material-symbols-rounded" aria-hidden="true">edit</i>Input panel
                    </a>
                </nav>
                <div class="controls">
                    <div class="filter search">
                        <i class="material-symbols-rounded" aria-hidden="true">search</i>
                        <input type="search" id="search" placeholder="Team, player, court…" autocomplete="off" aria-label="Search">
                    </div>
                    <div class="filter select">
                        <!-- Filled from orgs; also settable via ?org=<org> -->
                        <select id="org_filter" aria-label="Organisation"></select>
                    </div>
                    <!-- "Log in", or the signed-in account (js/auth.js - shared with the input panel) -->
                    <div id="account" class="account"></div>
                </div>
            </header>

            <div id="toast" class="toast hidden" role="status" aria-live="polite">
                <span class="toast_icon" aria-hidden="true"></span>
                <p class="toast_text"></p>
            </div>

            <dialog id="login_dialog" class="login_dialog" aria-labelledby="login_title">
                <!-- Same field names and autocomplete as the input panel's login, so password managers fill both -->
                <form id="login_form" method="post" action="#">
                    <h2 id="login_title">Log in</h2>
                    <p class="login_hint">For operators and admins: control your courts. The session is shared with the input panel.</p>
                    <label for="login_email">Email</label>
                    <input type="email" id="login_email" name="email" autocomplete="username" required>
                    <label for="login_password">Password</label>
                    <input type="password" id="login_password" name="password" autocomplete="current-password" required>
                    <p id="login_error" class="login_error hidden" role="alert"></p>
                    <div class="login_actions">
                        <button type="button" id="login_cancel" class="secondary">Cancel</button>
                        <button type="submit" id="login_submit" class="primary">Log in</button>
                    </div>
                </form>
            </dialog>

            <div id="summary" class="summary" aria-live="polite"></div>
            <p id="overview_error" class="error hidden" role="alert"></p>

            <section id="section_live" class="section">
                <h2>On court <span class="section_count"></span></h2>
                <p class="empty_state hidden"></p>
                <div class="card_grid"></div>
            </section>

            <section id="section_finished" class="section hidden">
                <h2>
                    <button type="button" class="section_toggle" aria-expanded="true" aria-controls="grid_finished">
                        Just finished <span class="section_count"></span>
                        <i class="material-symbols-rounded chevron" aria-hidden="true">expand_more</i>
                    </button>
                </h2>
                <div class="card_grid" id="grid_finished"></div>
            </section>

            <section id="section_idle" class="section hidden">
                <h2>
                    <button type="button" class="section_toggle" aria-expanded="false" aria-controls="grid_idle">
                        Inactive courts <span class="section_count"></span>
                        <i class="material-symbols-rounded chevron" aria-hidden="true">expand_more</i>
                    </button>
                </h2>
                <div class="card_grid" id="grid_idle"></div>
            </section>

            <footer class="page_foot">
                A court counts as running while its score changes at least every 10 minutes.
            </footer>
        </div>
    </div>
</body>

</html>
